version: 2
updates:
  # Code dependencies are upgraded by the release process itself (the version
  # is derived from the commits), so only the Actions the workflows use are
  # tracked here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - "Delnegend"
