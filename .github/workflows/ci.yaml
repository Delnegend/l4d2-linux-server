name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/delnegend/l4d2-linux-server

jobs:
  verify:
    # This is the gate. main has no branch protection behind it, so this run is
    # the only thing between a commit and a published image: it boots a real
    # server, checks the A2S self-check and the plugin stack, and fails on any
    # `Unknown command` the game build introduces.
    name: Check (just verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docs check, install, A2S self-check, plugin stack
        run: just verify
        env:
          CONTAINER_ENGINE: docker
          EXTRA_BUILD_ARGS: --cache-from type=registry,ref=${{ env.IMAGE }}:buildcache --load
          L4D2_SMOKE_DIR: ${{ github.workspace }}/.smoke
