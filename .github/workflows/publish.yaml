name: Build and Publish Container Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag the image with (e.g. 1.0.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          case "$version" in
            ''|*[!0-9.]*) echo "::error::refusing to tag with version '$version'"; exit 1 ;;
          esac
          major="${version%%.*}"
          minor="${version#*.}"
          minor="${minor%%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      # One published image, tagged by semver only: the exact version, the
      # rolling major.minor and major, and `latest`. There is no per-target tag,
      # so `:1.0.3` always means the same thing.
      #
      # `base` is a build stage, not a published image: it exists so the layers
      # above can be proven to sit on an unmodified install, and so a rebuild
      # after an entrypoint or config change hits the build cache instead of
      # re-downloading 10 GB. Its layers still ship as parents of `server`.
      #
      # The registry blobs are zstd level 4. Anything that pulls this image
      # needs a runtime that understands zstd layers (containerd 1.7+,
      # Docker 20.10+, podman 3+); if that ever stops being true, change
      # `outputs` to `type=image,compression=gzip`.
      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            SERVER_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,compression=zstd,compression-level=4
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
