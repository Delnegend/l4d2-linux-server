name: Build and Publish Container Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag the images with (e.g. 1.0.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          case "$version" in
            ''|*[!0-9.]*) echo "::error::refusing to tag with version '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `base` is a build stage, not a published image: it exists so qol and
      # coop8 layer onto a provably unmodified install, and pushing it would
      # cost 20 GB of registry blobs per release that nothing ever deploys.
      # Its layers still ship - they are the parents of the qol image.
      - name: Build and push qol
        uses: docker/build-push-action@v7
        with:
          context: .
          target: qol
          platforms: linux/amd64
          push: true
          build-args: |
            SERVER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-qol
            ${{ env.IMAGE }}:qol
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      # Thin layer on qol (l4dtoolz + its cvars), so it reuses the whole cache
      # and costs seconds. Deliberately not aliased to `latest`: qol stays the
      # default deployment until coop8 is verified with real clients.
      - name: Build and push coop8
        uses: docker/build-push-action@v7
        with:
          context: .
          target: coop8
          platforms: linux/amd64
          push: true
          build-args: |
            SERVER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-coop8
            ${{ env.IMAGE }}:coop8
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
