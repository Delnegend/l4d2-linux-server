services:
  l4d2:
    build:
      context: .
      target: qol
    image: l4d2-linux-server:qol
    container_name: l4d2-server
    restart: unless-stopped
    # host networking avoids UDP NAT overhead and allows local LAN discovery
    network_mode: host
    userns_mode: keep-id
    user: "1000:1000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-27015}
      - STEAM_PORT=${STEAM_PORT:-26901}
      - SERVER_NAME=${SERVER_NAME:-Left 4 Dead 2 Dedicated Server}
      - RCON_PASSWORD=${RCON_PASSWORD:-ChangeThisRconPassword123}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - DEFAULT_MAP=${DEFAULT_MAP:-c1m1_hotel}
      - STEAM_GROUP_ID=${STEAM_GROUP_ID:-}
      - STEAM_GROUP_EXCLUSIVE=${STEAM_GROUP_EXCLUSIVE:-0}
      - SV_CONSISTENCY=${SV_CONSISTENCY:-0}
      - SV_PURE=${SV_PURE:-0}
      - EXTRA_ARGS=${EXTRA_ARGS:-}
    volumes:
      # Only the writable state lives here. The ~20 GB game install is baked
      # into the image at /opt/l4d2 and linked in at start-up.
      - ./data:/data
