// l4dmultislots: turn spare slots into actual survivors.
//
// Shipped in the image so a 5+ co-op server works on first boot. SourceMod
// would auto-generate this file with its own defaults, which are the official
// four-survivor behaviour; these two cvars are what make it a 5+ server.
//
// To change them, replace the symlink with a real file - see
// docs/configuration.md#sourcemod-and-metamod.

l4d_multislots_max_survivors "10"
l4d_multislots_min_survivors "8"

// Pre-fill the start safe room with eight survivors at round start, so the
// fifth player arriving mid-round is not the only extra one.
l4d_multislots_spawn_survivors_roundstart "1"
