// Image-level persistent overrides, appended to the rendered server.cfg by
// the entrypoint before the operator's own /data/left4dead2/cfg/server_custom.cfg.
// Only the coop8 target ships this file; qol has no /defaults/server_custom.cfg.
//
// --- 8-player co-op campaign (l4dtoolz) ---
//
// The engine's client limit is 18 and it ignores `maxplayers` on its own, so
// neither `+maxplayers` nor a `maxplayers` cvar does anything. What actually
// holds a co-op campaign to four survivors is the Steam lobby the server
// registers: while a lobby cookie is present the game caps campaigns at 4 and
// versus at 8. Dropping the reservation is what unlocks the extra seats.
//
//   sv_force_unreserved  the built-in alternative to the l4d_unreservelobby
//                        plugin: sets sv_allow_lobby_connect_only to 0 and
//                        stops processing lobby matching requests, so no lobby
//                        cookies are issued.
//   sv_maxplayers        the player cap itself, -1..31. Not to be confused with
//                        the engine's MaxClients (sv_setmax, 18..32), which
//                        this image leaves at its default; l4dtoolz warns
//                        against raising it above 31.
//   precache_all_survivors  loads every survivor model up front, which is what
//                        stops the server from crashing when more than four
//                        different characters are in play at once.
//
// Reachability is a separate matter and lives outside the image: the L4D2
// client lobby only ever shows four co-op slots. Players either connect
// directly (mm_dedicated_force_servers <ip>:27015) or the server is reached
// through the Steam group list, which needs no client mod at all.

sv_force_unreserved 1
sv_maxplayers 8
precache_all_survivors 1
